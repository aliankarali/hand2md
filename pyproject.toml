[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hand2md"
version = "0.1.0"
description = "Offline handwriting-to-Markdown CLI (Qwen3-VL via MLX, Apple Vision fallback)"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Ankarali" }]
dependencies = [
    "mlx-vlm>=0.7.12",
    "pillow>=11",
    "pyobjc-framework-Vision>=11",
    "huggingface_hub>=1.0",
]

[project.scripts]
hand2md = "hand2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
